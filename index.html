<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tipping Point Solution | Client Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--o:#F7941D;--b:#2A3990;--r:#BE1E2D;--k:#000;--g:#666;--l:#e6e6e6}
*{box-sizing:border-box}
body{margin:0;font-family:Kanit,"Noto Sans Thai",sans-serif;color:var(--k);background:#fff;font-weight:300;font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 20px 64px}
header{display:flex;justify-content:space-between;align-items:center}
header img{height:64px;margin-left:-10px}
.lang button{font:400 14px Kanit;border:2px solid var(--k);background:#fff;padding:4px 14px;cursor:pointer}
.lang button:first-child{border-radius:99px 0 0 99px}.lang button:last-child{border-radius:0 99px 99px 0;border-left:0}
.lang button.on{background:var(--k);color:#fff}
.dots{display:flex;gap:10px;margin:18px 0 28px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--l);background:#fff;transition:.25s}
.dots i.d0.on{background:var(--o);border-color:var(--o)}.dots i.d1.on{background:var(--b);border-color:var(--b)}.dots i.d2.on{background:var(--r);border-color:var(--r)}
h2{font:300 clamp(28px,7vw,40px)/1.1 Kanit;text-transform:uppercase;margin:0 0 6px}
.sub{color:var(--g);margin:0 0 8px}
.q{margin:26px 0}
.q>label{display:block;font-weight:400;margin-bottom:10px}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate button{width:48px;height:48px;border-radius:50%;border:2px solid var(--k);background:#fff;font:400 17px Kanit;cursor:pointer}
.rate.nps button{width:40px;height:40px;font-size:15px}
.rate button.on{background:var(--o);border-color:var(--o)}
.ends{display:flex;justify-content:space-between;color:var(--g);font-size:13px;margin-top:6px;max-width:300px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:2px solid var(--k);background:#fff;border-radius:99px;padding:8px 16px;font:300 15px Kanit;cursor:pointer}
.chips button.on{background:var(--b);border-color:var(--b);color:#fff}
.svc{margin-top:14px;padding:12px 16px;border-left:5px solid var(--o);background:#f7f7f7}
.svc p{margin:0 0 8px;font-weight:400}
input,textarea,select{width:100%;border:2px solid var(--k);border-radius:12px;padding:12px 14px;font:300 16px Kanit;background:#fff}
textarea{min-height:110px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.btn{font:400 16px Kanit;padding:13px 30px;border-radius:99px;border:2px solid var(--k);background:#fff;cursor:pointer}
.btn.p{background:var(--k);color:#fff}
.err{color:var(--r);font-weight:400;margin-top:16px}
.tag{display:inline-block;border:2px solid var(--k);border-radius:99px;padding:2px 14px;font-weight:400;margin:4px 6px 0 0}
.ai{display:flex;align-items:center;gap:10px;font:400 20px Kanit;color:var(--b);margin:40px 0 0;padding-top:20px;border-top:2px solid var(--l)}.ai:before{content:"";width:14px;height:14px;border-radius:50%;background:var(--o)}
.cover{padding:8px 0 0}
.cover h1{font:300 34px/1.2 Kanit;white-space:nowrap;margin:0 0 16px}
.cover .big{display:block;width:112%;max-width:520px;margin:0 0 14px -8%;animation:fade .9s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cover .big{animation:none}}
.cover p{max-width:30em;color:var(--g);font-size:18px;margin:0 0 16px}
.nav.start{justify-content:flex-start}
@media (prefers-reduced-motion:reduce){.thanks{padding:30px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="logo.png" alt="Tipping Point Solution"><div class="lang" id="lang"></div></header>
<div id="app"></div>
</div>
<script>
// ===== ตั้งค่า / Settings =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqLYCMspoBZsOi-BKEaSiqV09vR6Y-u9K8rVR16qk6JVFvxf7OZP3UE1rfAKL_QEz_/exec"; // URL จาก Google Apps Script (ดูขั้นตอนในไฟล์ apps-script.gs)

const P = new URLSearchParams(location.search);
const CLIENT = P.get("client") || "", AE = P.get("ae") || "";
let lang = "th", step = 0, A = {}, err = false, done = false;
const L = a => a[lang === "th" ? 0 : 1];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const SERVICES = [
 ["แบรนด์และการสื่อสาร","Brand Communication","brand"],["ครีเอทีฟและโปรดักชัน","Creative & Production","creative"],
 ["โซเชียลมีเดีย","Social Media","social"],["ดาต้าและเทคโนโลยี","Data & Technology","data"],
 ["มีเดียและ Ads Optimization","Media & Performance Ads","media"],["อีคอมเมิร์ซ","E-Commerce","ecom"]
];
const AIHELP = [
 ["งานเสร็จเร็วขึ้น","Faster delivery","speed"],["ไอเดียหลากหลายขึ้น","More ideas","ideas"],
 ["วิเคราะห์ข้อมูลลึกขึ้น","Deeper data insights","data"],["ประหยัดต้นทุน","Lower cost","cost"],
 ["คุณภาพสม่ำเสมอ","More consistent quality","quality"],["ยังไม่เห็นความต่าง","No difference yet","none"]
];
const PLANS = [
 ["เปิดตัวสินค้าใหม่","New product launch","launch"],["แคมเปญใหญ่","Major campaign","campaign"],
 ["รีแบรนด์","Rebranding","rebrand"],["CRM / Loyalty","CRM / Loyalty","crm"],
 ["KOL / Influencer","KOL / Influencer","kol"],["เพิ่มงบ Ads","Scale up ads","ads"],
 ["ขายออนไลน์ / อีคอมเมิร์ซ","E-commerce / online sales","ecom"],["Data / Personalization","Data / Personalization","cdp"],
 ["Event / PR","Event / PR","event"],["AR / VR / Innovation","AR / VR / Innovation","innov"],
 ["เว็บไซต์ / แอป","Website / App","web"],["ยังไม่แน่ใจ","Not sure yet","unsure"]
];
const WANT = [["อยากให้ทีมเสนอไอเดีย","Yes, send us ideas","yes"],["ยังไม่ต้อง","Not now","no"]];
const Y = new Date().getFullYear();
const PERIODS = [Y, Y - 1].flatMap(y => [4, 3, 2, 1].map(n => `Q${n}/${y}`));

// ===== ตัวช่วยสร้าง UI =====
const rate = (k, n = 5, s = 1, cls = "") => `<div class="rate ${cls}">${Array.from({length:n},(_,i)=>i+s).map(v=>`<button type="button" data-k="${k}" data-v="${v}" class="${A[k]===v?"on":""}" aria-label="${v}">${v}</button>`).join("")}</div>`;
const chips = (k, o) => `<div class="chips">${o.map(x=>`<button type="button" data-c="${k}" data-v="${x[2]}" class="${(A[k]||[]).includes(x[2])?"on":""}">${L(x)}</button>`).join("")}</div>`;
const pick = (k, o) => `<div class="chips">${o.map(x=>`<button type="button" data-s="${k}" data-v="${x[2]}" class="${A[k]===x[2]?"on":""}">${L(x)}</button>`).join("")}</div>`;
const q = (t, body, n = 0, key = "") => `<div class="q"><label>${n?n+". ":""}${L(t)}${REQ.flat().includes(key)?" *":""}</label>${body}</div>`;
const field = (k, t, ph, area, n) => q(t, area ? `<textarea data-t="${k}" placeholder="${esc(L(ph))}">${esc(A[k])}</textarea>` : `<input data-t="${k}" value="${esc(A[k])}" placeholder="${esc(L(ph))}">`, n, k);
const sel = (k, t, ph) => q(t, `<select data-t="${k}"><option value="">${esc(L(ph))}</option>${PERIODS.map(p=>`<option ${A[k]===p?"selected":""}>${p}</option>`).join("")}</select>`, 0, k);
const head = (t, s) => `<h2>${L(t)}</h2>${s ? `<p class="sub">${L(s)}</p>` : ""}`;
const SCALE = ["เกณฑ์คะแนน: 1 = ต้องปรับปรุงอย่างมาก, 5 = ดีเยี่ยม","Scale: 1 = needs major improvement, 5 = excellent"];
const r5 = (k, th, en, n) => q([th, en], rate(k), n);

function cover() {
  return `<div class="cover"><img class="big" src="logo.png" alt="Tipping Point Solution">`
   + (CLIENT ? `<p><span class="tag">${esc(CLIENT)}</span></p>` : "")
   + `<h1>Thank you for letting us be your solution</h1>`
   + `<p>${L(["บอกเราหน่อยว่าเราทำได้ดีแค่ไหน และอะไรที่ควรทำให้ดีขึ้น ใช้เวลาราว 3 นาที ส่วนใหญ่เป็นการกดเลือก","Tell us how we are doing and what we can do better. It takes about 3 minutes, mostly taps."])}</p></div>`;
}
function fitCover() {
  const h = document.querySelector(".cover h1"); if (!h) return;
  h.style.fontSize = ""; let f = parseFloat(getComputedStyle(h).fontSize);
  while (h.scrollWidth > h.clientWidth && f > 12) { f -= 0.5; h.style.fontSize = f + "px"; }
}
const STEPS = [
 () => cover(),
 () => head(["ข้อมูลผู้ประเมิน","About you"], ["ใช้เวลาประมาณ 3 นาที ความเห็นของคุณช่วยให้เราทำงานให้ดีขึ้น","Takes about 3 minutes. Your feedback helps us do better work."])
  + (CLIENT ? `<p><span class="tag">${esc(CLIENT)}</span></p>` : field("client", ["ชื่อแบรนด์ / บริษัท (Client Name)","Brand / company (Client Name)"], ["ระบุชื่อบริษัทของคุณ","Your company name"]))
  + field("contact", ["ชื่อผู้ติดต่อ (Contact Person)","Contact person"], ["ระบุชื่อของคุณ","Your name"])
  + field("position", ["ตำแหน่ง (Position)","Position"], ["เช่น Marketing Manager","e.g. Marketing Manager"])
  + sel("period", ["ประจำไตรมาส (Quarter/Year)","Quarter / Year"], ["เลือกไตรมาส","Select quarter"])
  + q(["บริการที่ใช้กับเรา (เลือกได้หลายข้อ)","Services you use with us (select all that apply)"], chips("services", SERVICES)),
 () => head(["ส่วนที่ 1: ภาพรวมความพึงพอใจ","Part 1: Overall satisfaction"])
  + q(["ความพึงพอใจในภาพรวมต่อการให้บริการของเรา (1 = ต่ำสุด, 10 = สูงสุด)","Overall satisfaction with our service (1 = lowest, 10 = highest)"], rate("sat_overall", 10, 1, "nps"), 1, "sat_overall")
  + q(["โอกาสที่คุณจะแนะนำบริการของเราให้กับพาร์ทเนอร์ (NPS: 0 = ไม่แนะนำ, 10 = แนะนำแน่นอน)","How likely are you to recommend our services to a partner (NPS: 0 = not at all, 10 = definitely)"], rate("nps", 11, 0, "nps"), 2, "nps"),
 () => head(["ส่วนที่ 2: การบริการและการสื่อสาร","Part 2: Service and communication"], SCALE)
  + r5("svc_response", "ความรวดเร็วในการตอบกลับ และการประสานงานของทีมงาน", "Speed of response and coordination from the team", 3)
  + r5("svc_proactive", "ความกระตือรือร้นในการให้คำแนะนำ เสนอไอเดีย และแก้ไขปัญหา", "Proactiveness in advising, suggesting ideas and solving problems", 4)
  + r5("svc_understanding", "ความเข้าใจในแบรนด์ เป้าหมาย และอุตสาหกรรมของธุรกิจคุณ", "Understanding of your brand, goals and industry", 5),
 () => head(["ส่วนที่ 3: คุณภาพงานและการใช้ AI","Part 3: Work quality and AI"], SCALE)
  + r5("q_overall", "คุณภาพ ความคิดสร้างสรรค์ และความถูกต้องของชิ้นงานโดยรวม", "Overall quality, creativity and accuracy of the work", 6)
  + r5("q_ontime", "การบริหารจัดการเวลา และการส่งมอบงานได้ตรงตามกำหนดเวลา", "Time management and on-time delivery", 7)
  + r5("q_kpi", "ผลลัพธ์ของแคมเปญเป็นไปตามเป้าหมาย (KPIs) ที่ตกลงกันไว้", "Campaign results meet the agreed KPIs", 8)
  + `<div class="ai">${L(["การใช้ AI (AI Integration)","AI Integration"])}</div>`
  + r5("ai_satisfaction", "ความพึงพอใจต่อการที่ทีมงานนำ AI มาช่วยเพิ่มประสิทธิภาพและสร้างชิ้นงาน", "Satisfaction with how the team uses AI to improve efficiency and create work", 9)
  + r5("ai_quality", "คุณภาพงานที่มีการใช้ AI (ความสมจริง, การรักษา Brand CI)", "Quality of AI-assisted work (realism, brand CI consistency)", 10)
  + q(["AI ช่วยงานของคุณด้านไหน (เลือกได้หลายข้อ)","Where has AI helped your work (select all that apply)"], chips("ai_helps", AIHELP)),
 () => head(["ส่วนที่ 4: ข้อเสนอแนะเชิงลึก","Part 4: Detailed feedback"], ["ทุกข้อไม่บังคับ พิมพ์สั้นๆ ได้เลย","All optional. A short note is fine."])
  + field("ai_view", ["มุมมองเรื่องการใช้ AI: คุณมีข้อดีที่ชื่นชอบ หรือมีข้อกังวลใดที่อยากแนะนำให้เราปรับปรุงหรือไม่?","Your view on AI: what do you like, or what concerns would you like us to improve?"], ["",""], true, 11)
  + field("keep_doing", ["Keep Doing: สิ่งใดที่ทีมงานทำได้ดีอยู่แล้วและอยากให้รักษามาตรฐานนี้ไว้?","Keep doing: what is the team already doing well that you want us to maintain?"], ["",""], true, 12)
  + field("improve", ["Area of Improvement: มีส่วนใดที่เราสามารถปรับปรุงเพิ่มเติม เพื่อซัพพอร์ตธุรกิจของคุณให้ดียิ่งขึ้น?","Area of improvement: where can we do better to support your business?"], ["",""], true, 13)
  + q(["Future Needs: ใน 3-6 เดือนข้างหน้า สนใจบริการด้านใดเพิ่มเติมเป็นพิเศษหรือไม่?","Future needs: in the next 3-6 months, is there any service you are especially interested in?"],
     chips("plans", PLANS)
     + `<div style="margin-top:12px"><textarea data-t="future_needs" placeholder="${esc(L(["เล่าแผนหรือโจทย์เพิ่มเติม","Tell us more about your plans or challenges"]))}">${esc(A.future_needs)}</textarea></div>`
     + `<div style="margin-top:14px">${pick("want_proposal", WANT)}</div>`, 14)
];
const REQ = [[], [...(CLIENT ? [] : ["client"]), "contact", "position", "period"], ["sat_overall", "nps"], [], [], []];
if (P.get("period")) A.period = P.get("period");

function draw() {
  const $app = document.getElementById("app");
  document.getElementById("lang").innerHTML = ["th","en"].map(l => `<button data-l="${l}" class="${lang===l?"on":""}">${l.toUpperCase()}</button>`).join("");
  document.documentElement.lang = lang;
  if (done) {
    $app.innerHTML = `<div class="thanks">${head(["ขอบคุณค่ะ","Thank you"], ["เราได้รับความเห็นของคุณแล้ว ทีมงานจะนำไปปรับปรุงและติดต่อกลับในประเด็นที่เกี่ยวข้อง","We have your feedback. The team will act on it and follow up where needed."])}</div>`;
    return;
  }
  const intro = step === 0;
  const dots = STEPS.slice(1).map((_, i) => `<i class="d${i%3} ${i+1<=step?"on":""}"></i>`).join("");
  const last = step === STEPS.length - 1;
  $app.innerHTML = (intro ? "" : `<div class="dots" aria-label="${step}/${STEPS.length-1}">${dots}</div>`) + STEPS[step]()
   + (err ? `<p class="err">${L(["กรุณากรอกข้อมูลที่จำเป็นให้ครบ","Please complete the required answers"])}</p>` : "")
   + `<div class="nav${intro?" start":""}">${step>0?`<button class="btn" data-n="back">${L(["ย้อนกลับ","Back"])}</button>`:""}<button class="btn p" data-n="${last?"send":"next"}">${L(last?["ส่งความเห็น","Send feedback"]:intro?["เริ่มเลย","Start"]:["ถัดไป","Next"])}</button></div>`;
  document.querySelector("header img").style.visibility = intro ? "hidden" : "";
  fitCover();
}

function missing() { return REQ[step].some(k => A[k] === undefined || A[k] === ""); }

async function send() {
  const p = {timestamp:new Date().toISOString(), lang, client:CLIENT||A.client, ae:AE};
  Object.entries(A).forEach(([k,v]) => { if (k !== "client") p[k] = Array.isArray(v) ? v.join(", ") : v; });
  try {
    if (SCRIPT_URL.includes("PASTE")) console.log("Demo mode, payload:", p);
    else await fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(p)});
    done = true;
  } catch (e) { alert(L(["ส่งไม่สำเร็จ กรุณาลองอีกครั้ง","Could not send. Please try again."])); }
  draw();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.l) lang = d.l;
  else if (d.k) A[d.k] = +d.v;
  else if (d.s) A[d.s] = d.v;
  else if (d.c) { const a = A[d.c] || (A[d.c] = []); const i = a.indexOf(d.v); i < 0 ? a.push(d.v) : a.splice(i, 1); }
  else if (d.n === "back") { step--; err = false; scrollTo(0, 0); }
  else if (d.n) {
    if (missing()) err = true;
    else { err = false; if (d.n === "next") { step++; scrollTo(0, 0); } else return send(); }
  } else return;
  draw();
});
document.addEventListener("input", e => { if (e.target.dataset.t) A[e.target.dataset.t] = e.target.value.trim(); });
draw();
if (document.fonts) document.fonts.ready.then(fitCover);
</script>
</body>
</html>
